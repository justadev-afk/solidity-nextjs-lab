name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (bun 1.3.14 / node 22.16.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # forge-std lives in packages/contracts/lib/forge-std as a git submodule.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Next 16 requires Node >= 20.9 and several toolchain steps shell out to node,
      # so the runner's node is pinned to the same version as .nvmrc.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  # This is a practice lab: the exercise contracts under packages/contracts/src are
  # implemented by hand, so this job is EXPECTED TO BE RED until the current exercise
  # compiles and its tests pass. A failure here means "the exercise is not finished",
  # not "CI is broken" -- the `web` job above is the gate for the tooling itself.
  # Nothing is masked on purpose: forge fmt --check, forge build and forge test all
  # run for real and their exit codes are the job result.
  contracts:
    name: contracts (foundry v1.7.1, red until the exercise is implemented)
    runs-on: ubuntu-latest
    env:
      # [profile.ci] in foundry.toml raises verbosity and fuzz runs.
      FOUNDRY_PROFILE: ci
      # foundry.toml interpolates these in [rpc_endpoints]/[etherscan]; they are defined
      # (empty) so parsing never fails. The local `anvil` endpoint is a literal URL now,
      # so no ANVIL_RPC_URL is needed.
      SEPOLIA_RPC_URL: ""
      ETHERSCAN_API_KEY: ""
    defaults:
      run:
        shell: bash
        working-directory: packages/contracts
    steps:
      # `submodules: recursive` pulls forge-std v1.16.2, so `contracts:deps`
      # (forge install) must NOT run here.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show toolchain versions
        run: |
          forge --version
          cast --version

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Build contracts
        run: forge build --sizes

      - name: Test contracts
        run: forge test -vvv
